<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS GLOBAL - AI Growth OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var applyTheme = theme === 'light' || theme === 'dark' ? theme : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.body.setAttribute('data-theme', applyTheme);
          document.documentElement.setAttribute('data-theme', applyTheme);
        } catch (e) {
          document.body.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </body>
</html>
